services:
  service:
    image: ecobenchmark/service-ruby-rails-pg:local
    build: .
    cpus: 1
    mem_limit: 1g
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DATABASE_URL: postgres://postgres:mysecretpassword@database:5432/postgres
      DATABASE_POOL_MAX: "20"
      # Local benchmark only. Supply your own secret for deployments.
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-local-benchmark-only-not-a-deployment-secret-0123456789abcdef0123456789abcdef}
    healthcheck:
      test: ["CMD", "ruby", "-rnet/http", "-e", "exit(Net::HTTP.start('127.0.0.1', 8080) { |http| http.head('/healthcheck') }.code == '204' ? 0 : 1)"]
      interval: 3s
      timeout: 3s
      start_period: 10s
      retries: 20

  database:
    image: ecobenchmark-upgrade/postgres:18.6
    build: ../../migrations
    environment:
      POSTGRES_PASSWORD: mysecretpassword
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 1s
      retries: 20

  runner:
    image: grafana/k6:0.57.0
    volumes:
      - ../../runner:/config:ro
    environment:
      SERVER_HOST: service:8080
    command: ["run", "--vus", "2", "--duration", "1m", "/config/scenario.js"]
    depends_on:
      service:
        condition: service_healthy
